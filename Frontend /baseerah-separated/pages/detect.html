<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التحقق الصوتي | بصيرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>8:15</span><span>🔕 📶 🔋</span></div>
  <div class="top">
    <button class="iconbtn" onclick="goBack()" aria-label="رجوع">›</button>
    <div class="crumb">بصيرة</div>
    <div class="spacer32"></div>
  </div>
  
  <main class="screen">
    
<div class="h1 disp">التحقق الصوتي</div>
<div class="card">
  <div class="field" id="up-detect">⬆ اختر مقطعًا صوتيًا للفحص</div>
  <input type="file" accept="audio/*" id="file-detect" hidden>
  <button class="btn block" id="verifyAudioBtn">ابدأ التحقق</button>

<p id="audioStatus"
   style="display:none;color:var(--muted);font-size:13px;text-align:center;margin-top:12px;">
</p>
</div>


<div class="card" style="margin-top:16px;">
  <div style="font-weight:700;margin-bottom:6px;">
    التحقق من هوية المتحدث
  </div>

  <div style="color:var(--muted);font-size:13px;margin-bottom:12px;">
    ارفع المقطع وسيقارنه بصيرة بالأصوات المرجعية الموثوقة.
  </div>

  <div class="field"
       id="speaker-candidate-picker"
       onclick="document.getElementById('speaker-candidate').click()">
    ⬆ اختر المقطع الصوتي
  </div>

  <input
    type="file"
    accept="audio/*"
    id="speaker-candidate"
    hidden
  >

  <audio
    id="speaker-candidate-player"
    controls
    style="display:none;width:100%;margin-top:8px;">
  </audio>

  <button
    class="btn block"
    id="verifySpeakerBtn"
    style="margin-top:12px;">
    تحقق من هوية المتحدث
  </button>

  <div
    id="speakerResult"
    style="display:none;margin-top:14px;text-align:center;">
  </div>
</div>

  </main>
  <nav class="tabbar"><a href="../index.html" class=""><span class="ti">⌂</span>الرئيسية</a><a href="tools.html" class=""><span class="ti">♡</span>محبة الأدوات</a><a href="authors.html" class=""><span class="ti">▤</span>المؤلفات</a><a href="more.html" class=""><span class="ti">⋯</span>المزيد</a></nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
